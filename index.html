        <script>
            const emote = (s) => {
                return `<button type="button" class="live_chatting_message_button__WY3rb"><img alt="" src="${s}" /></button>`;
            };
            window.onload = () => {
                document.querySelectorAll("span.live_chatting_message_text__DyleH").forEach((node, index) => {
                    node.innerHTML = `우와우와`;
                });
                const input = document.getElementById("fileInput");
                const btn = document.getElementById("send_chat_or_donate");
                btn.addEventListener("click", () => {
                    input.click();
                });
                input.addEventListener("change", function () {
                    const files = Array.from(input.files).slice(0, 10);
                    const spans = [];
                    document.querySelectorAll("span.live_chatting_message_text__DyleH").forEach((node, index) => {
                        spans.push(node);
                    });
                    const donate = document.querySelectorAll(".live_chatting_donation_message_text__XbDKP")[0];
                    files.forEach((file, index) => {
                        console.log(file);
                        if (!file.type.match("image/png") && !file.type.match("image/gif")) return;

                        const reader = new FileReader();

                        reader.onload = function (e) {
                            spans[index].innerHTML = `우와` + emote(e.target.result) + emote(e.target.result) + `우와` + emote(e.target.result);
                            donate.innerHTML += emote(e.target.result);
                        };

                        reader.readAsDataURL(file);
                    });
                });
            };
        </script>
